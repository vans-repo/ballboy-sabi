paths:
  raw:        data/raw/npfl_chronological_data.csv
  processed:  data/processed/npfl_clean_data.csv
  features:   data/features/npfl_master_model_data.csv
  model:      models/npfl_brain.pkl
  encoder:    models/label_encoder.pkl

model:
  n_estimators:     300
  max_depth:        10
  min_samples_leaf: 2
  random_state:     42
  test_size:        0.15
  min_accuracy:     0.55

features:
  - Home_Form_Pts
  - Away_Form_Pts
  - Home_Rest_Days
  - Away_Rest_Days
  - Home_Attack_L5
  - Away_Defense_L5
  - Travel_Distance_Km
  - Home_Quality
  - Away_Quality

target: Outcome

engineering:
  form_window:    5
  quality_window: 10
  quality_min:    0.60
  quality_max:    1.30
  rest_default:   7

travel:
  road_factor:   1.3
  flight_factor: 0.8
  flight_min_km: 500

flying_clubs:
  - Enyimba
  - Rivers United
  - Remo Stars
  - Kano Pillars
  - El-Kanemi Warriors
  - Akwa United

