# Every NPFL team the seed knows about.
#
# Sources:
#   - names and coordinates: reference/naijaball-main/npfl_system/config/config.yaml
#     (team_coords, as [lat, lon]). "Doma United" and "Doma United FC" there are one team.
#   - aliases: ALIAS_MAP in reference/naijaball-main/npfl_system/src/utils/helpers.py
#   - Dakkada and MFM appear only in reference/npfl_historical_data.csv and have
#     no coordinates in the reference, so lat and lon are left empty.
#
# Codes are new (3 capital letters, chosen for this site; edit freely).
# Left empty on purpose, for the site owner to fill in (never guessed):
#   city, primary_colour, secondary_colour  (empty colours use neutral placeholders)
#
# Every team also gets two automatic aliases: its name and its name + " fc",
# both lowercase. List only the extra spellings under `aliases`.
#
# The seed only adds teams and aliases that are missing. It never changes a
# team that is already in the database, so edits made in the admin screens
# are kept.

